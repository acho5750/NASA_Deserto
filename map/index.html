<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Centers and Water</title>
<meta name="description" content="US data center campuses on satellite imagery, the land Sentinel-1 radar measured as converted, the water sources their utilities depend on, and a 2026-2030 projection.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
  :root {
    --card: #FFFFFF; --ink: #1F2328; --ink2: #3C4248; --muted: #646B73; --faint: #9AA1A9; --rule: #E6E8EB; --soft: #F4F5F7;
    --accent: #1A73E8; --campus: #F5A623; --radar: #7CB342;
    --lc-developed: #C9544B; --lc-cropland: #D7B13C; --lc-pasture_hay: #E3D28A; --lc-forest: #2F7D45;
    --lc-shrub_grass: #9DB57E; --lc-barren: #B5A995; --lc-wetlands: #4BA7AA; --lc-water: #3F7CC0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .18), 0 4px 16px rgba(0, 0, 0, .22);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
  body { font: 14px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #map { position: fixed; inset: 0; }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { position: fixed; z-index: 10; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); }

  /* search */
  #searchCard { top: 12px; left: 12px; width: 380px; height: 48px; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 14px; border-radius: 24px; }
  #searchCard .mark { flex: none; width: 22px; height: 22px; }
  #search { flex: 1; border: 0; outline: 0; font: inherit; font-size: 15px; padding: 0 8px; background: transparent; color: var(--ink); min-width: 0; }
  #search::placeholder { color: var(--muted); }
  .iconbtn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .iconbtn:hover { background: var(--soft); color: var(--ink); }
  #results { position: fixed; z-index: 11; top: 64px; left: 12px; width: 380px; max-height: 50vh; overflow-y: auto; padding: 6px 0; display: none; }
  #results.on { display: block; }
  #results button { display: flex; width: 100%; gap: 12px; align-items: center; border: 0; background: transparent; padding: 8px 16px; text-align: left; cursor: pointer; }
  #results button:hover, #results button.hi { background: var(--soft); }
  #results .ic { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  #results small { display: block; color: var(--muted); font-size: 12px; }

  /* side card */
  #panel { top: 72px; left: 12px; width: 380px; bottom: 84px; overflow: hidden; display: flex; flex-direction: column; }
  #panel .body { overflow-y: auto; flex: 1; scrollbar-width: thin; }
  .pad { padding: 18px 20px; }
  h1 { font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px; }
  h2 { font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; margin: 0 0 4px; }
  .lede { color: var(--ink2); font-size: 13.5px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .kicker { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
  .kicker i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--c); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .stats div { padding: 12px 14px; } .stats div + div { border-left: 1px solid var(--rule); }
  .stats b { display: block; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stats span { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.35; }
  .sec { padding: 16px 20px 4px; }
  .sec h3 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--ink); }
  .sec p { margin: 0 0 8px; color: var(--ink2); font-size: 13.5px; }
  .list { margin: 0 -20px; }
  .list button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; padding: 8px 20px; cursor: pointer; text-align: left; }
  .list button:hover { background: var(--soft); }
  .list .th { flex: none; width: 56px; height: 42px; border-radius: 6px; overflow: hidden; background: var(--soft); border: 1px solid var(--rule); }
  .list .th img { width: 100%; height: 100%; object-fit: cover; }
  .list .nm { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.35; }
  .list .nm small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .v { flex: none; font-size: 12.5px; color: var(--ink2); font-variant-numeric: tabular-nums; text-align: right; }
  .list .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--accent); cursor: pointer; padding: 0; font-weight: 500; font-size: 13px; margin-bottom: 10px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--rule); }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 500; color: var(--muted); font-size: 12px; }
  td.sel, th.sel { font-weight: 600; color: var(--ink); }
  figure { margin: 8px 0 4px; }
  figure img { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid var(--rule); }
  figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
  svg.chart { width: 100%; height: auto; display: block; }
  .lcbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 6px 0 8px; }
  .lclegend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: 12px; color: var(--muted); }
  .lclegend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--c); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-align: left; }
  .linkbtn:hover { text-decoration: underline; }
  .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: #fff; border-radius: 18px; padding: 7px 14px;
          font-size: 13px; font-weight: 500; color: var(--accent); cursor: pointer; margin: 4px 0 6px; }
  .pill:hover { background: #F1F6FE; }
  .srcs { font-size: 12px; color: var(--muted); padding: 14px 20px 20px; border-top: 1px solid var(--rule); margin-top: 12px; }
  .srcs a { color: var(--muted); }
  .chain { display: grid; grid-template-columns: 14px 1fr; gap: 0 10px; margin: 2px 0 8px; font-size: 13.5px; }
  .chain .d { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; background: var(--c); border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .chain .l { width: 2px; margin: 0 auto; background: var(--rule); min-height: 16px; }
  .chain .t { color: var(--ink2); padding-bottom: 4px; }
  details.about summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink); }
  details.about p { font-size: 12.5px; color: var(--ink2); margin: 8px 0; }
  code { font-size: 11.5px; background: var(--soft); padding: 1px 4px; border-radius: 4px; }
  .swatch { display: inline-block; width: 10px; height: 10px; background: rgba(240,75,46,.7); outline: 1.5px solid #FFD678; margin-right: 6px; vertical-align: -1px; }

  /* timeline */
  #timeline { bottom: 16px; left: calc(50% + 196px); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 8px; border-radius: 30px; white-space: nowrap; }
  #play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
  #play:hover { background: #1765CC; }
  .years { display: flex; gap: 2px; }
  .years button { border: 0; background: transparent; border-radius: 16px; padding: 6px 11px; font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
  .years button:hover { background: var(--soft); color: var(--ink); }
  .years button[aria-pressed=true] { background: #E8F0FE; color: var(--accent); font-weight: 600; }
  .vsep { width: 1px; height: 24px; background: var(--rule); }
  .seg { display: flex; background: var(--soft); border-radius: 16px; padding: 2px; }
  .seg button { border: 0; background: transparent; border-radius: 14px; padding: 5px 11px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed=true] { background: #fff; color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .tl-label { font-size: 11px; color: var(--muted); line-height: 1.2; }

  /* right controls */
  #ctrl { position: fixed; z-index: 10; right: 12px; bottom: 34px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .fab { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #fff; box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; color: var(--ink2); }
  .fab:hover { color: var(--ink); background: #F8F9FA; }
  .fab.txt { font-size: 13px; font-weight: 600; }
  .zoom { display: flex; flex-direction: column; background: #fff; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .zoom button { width: 40px; height: 40px; border: 0; background: #fff; cursor: pointer; font-size: 20px; color: var(--ink2); }
  .zoom button + button { border-top: 1px solid var(--rule); }
  #layers { top: 12px; right: 12px; width: 320px; max-height: calc(100vh - 100px); overflow-y: auto; padding: 14px 16px 16px; display: none; }
  #layers.on { display: block; }
  #layersBtn { position: fixed; z-index: 10; top: 16px; right: 12px; }
  #layers h3 { font-size: 13px; font-weight: 600; margin: 4px 0 8px; }
  .tog { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; font-size: 13.5px; cursor: pointer; }
  .tog input { width: 16px; height: 16px; accent-color: var(--accent); margin: 2px 0 0; flex: none; }
  .tog .sw { flex: none; width: 18px; height: 12px; border-radius: 3px; margin-top: 3px; }
  .tog small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.35; }
  .wrow { display: grid; grid-template-columns: 1fr 110px 18px; gap: 8px; align-items: center; font-size: 13px; color: var(--ink2); margin: 4px 0; }
  .wrow output { font-size: 12px; color: var(--muted); text-align: right; }
  .wrow input { accent-color: var(--accent); width: 100%; }
  .ramp { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #29B6F6, #FFD54F, #E53935); margin: 6px 0 2px; }
  .rampl { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 12px 0; }

  /* map chrome */
  .maplibregl-ctrl-attrib { font-size: 10.5px; }
  .maplibregl-ctrl-bottom-left .maplibregl-ctrl-scale { margin: 0 0 10px 404px; border-color: rgba(255,255,255,.9); color: #fff; background: rgba(0,0,0,.35); }
  .maplibregl-popup-content { padding: 8px 12px; border-radius: 8px; font: 13px/1.4 "Inter", sans-serif; box-shadow: var(--shadow); }
  .maplibregl-popup-content small { display: block; color: var(--muted); font-size: 12px; }
  .maplibregl-popup-tip { display: none; }
  #intro { position: fixed; z-index: 30; inset: 0; background: #000; transition: opacity 1.2s; pointer-events: none; }
  #intro.done { opacity: 0; }

  @media (max-width: 860px) {
    #searchCard, #results { left: 8px; right: 8px; width: auto; top: 8px; }
    #results { top: 60px; }
    #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 42vh; border-radius: 16px 16px 0 0; }
    #timeline { left: 8px; right: 8px; transform: none; bottom: calc(42vh + 10px); gap: 4px 6px; padding: 6px; flex-wrap: wrap; justify-content: center; border-radius: 22px; }
    .years { flex: 1; justify-content: space-between; } #scn { flex-basis: 100%; justify-content: center; } #scn button { flex: 1; }
    .tl-label, .vsep { display: none; } .years button { padding: 6px 6px; font-size: 12.5px; } .seg button { padding: 5px 7px; font-size: 12px; }
    #play { width: 32px; height: 32px; }
    #ctrl { display: none; }
    #layersBtn { top: 64px; right: 8px; } #layers { top: 64px; right: 8px; left: 8px; width: auto; }
    .maplibregl-ctrl-bottom-left .maplibregl-ctrl-scale { display: none; }
  }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Satellite map of data center campuses and water sources"></div>
<div id="intro"></div>

<div id="searchCard" class="card" role="search">
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#1A73E8"/><path d="M5 13.5c2.5-1 4.2 1.4 7 .4s4-3.3 7-2.4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="12" cy="8" r="2.2" fill="#FFD678"/></svg>
  <input id="search" placeholder="Search campuses and water sources" aria-label="Search campuses and water sources" autocomplete="off">
  <button class="iconbtn" id="homeBtn" title="Overview" aria-label="Show the overview">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></svg></button>
</div>
<div id="results" class="card" role="listbox" aria-label="Search results"></div>

<section id="panel" class="card" aria-label="Details"><div class="body" id="detail"></div></section>

<button id="layersBtn" class="fab" title="Layers" aria-label="Open layers" aria-expanded="false">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 2.5 8 12 13l9.5-5z"/><path d="m2.5 12.5 9.5 5 9.5-5"/><path d="m2.5 16.5 9.5 5 9.5-5" opacity=".55"/></svg></button>
<section id="layers" class="card" aria-label="Layers">
  <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0;font-size:15px">Layers</h3>
    <button class="iconbtn" id="layersClose" aria-label="Close layers"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8"><path d="M3 3l10 10M13 3 3 13"/></svg></button></div>
  <label class="tog"><input type="checkbox" id="lyrChange" checked><span class="sw" style="background:rgba(240,75,46,.7);outline:1.5px solid #FFD678"></span>
    <span>Land changed, seen by radar<small>Sentinel-1 pixels that changed during construction (zoom in on a built campus)</small></span></label>
  <label class="tog"><input type="checkbox" id="lyrSites" checked><span class="sw" style="background:#F5A623;border-radius:50%;width:12px;height:12px;margin:3px 3px 0;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.3)"></span>
    <span>Campuses and outlines<small>Orange: built. White: announced. Size grows with acres in the selected year.</small></span></label>
  <label class="tog"><input type="checkbox" id="lyrWater" checked><span class="sw" style="background:#29B6F6;border-radius:50%;width:12px;height:12px;margin:3px 3px 0;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.3)"></span>
    <span>Water sources<small>Lines to campuses appear when you select one</small></span></label>
  <label class="tog"><input type="checkbox" id="lyrRadar" checked><span class="sw" style="background:#C5E1A5"></span>
    <span>Radar views<small>Places with Sentinel-1 and NISAR image comparisons</small></span></label>
  <label class="tog"><input type="checkbox" id="lyrExposure"><span class="sw" style="background:linear-gradient(90deg,#43C08A 50%,#A47BE6 50%)"></span>
    <span>Nearby wetlands and protected land<small>Green ring: marsh or swamp within 100 m. Purple ring: protected land within 1 km.</small></span></label>
  <label class="tog"><input type="checkbox" id="lyrLabels" checked><span class="sw" style="background:#fff;border:1px solid #ccc"></span><span>Place names and roads</span></label>
  <label class="tog"><input type="checkbox" id="lyrTerrain" checked><span class="sw" style="background:linear-gradient(135deg,#8D6E63,#C5B49A)"></span><span>3D terrain</span></label>
  <hr>
  <h3>Water pressure index</h3>
  <div class="ramp" aria-hidden="true"></div><div class="rampl"><span>Lower</span><span>Higher</span></div>
  <p class="note" style="margin:8px 0 4px">Colors the water sources. Weights:</p>
  <div class="wrow"><label for="w1">Share of supply</label><input id="w1" type="range" min="0" max="3" step="0.5" value="1"><output id="w1o">1</output></div>
  <div class="wrow"><label for="w2">Source decline</label><input id="w2" type="range" min="0" max="3" step="0.5" value="1"><output id="w2o">1</output></div>
  <div class="wrow"><label for="w3">Water stress</label><input id="w3" type="range" min="0" max="3" step="0.5" value="1"><output id="w3o">1</output></div>
</section>

<div id="ctrl">
  <button class="fab txt" id="tilt" title="Tilt the view" aria-label="Switch between 2D and 3D view">3D</button>
  <button class="fab" id="compass" title="Point north" aria-label="Point north"><svg id="needle" width="22" height="22" viewBox="0 0 24 24"><path d="M12 3l3.5 9h-7z" fill="#E53935"/><path d="M12 21l-3.5-9h7z" fill="#9AA1A9"/></svg></button>
  <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button></div>
</div>

<section id="timeline" class="card" aria-label="Year and scenario">
  <button id="play" aria-label="Play the years 2026 to 2030"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" id="playIcon"><path d="M4 2v12l10-6z"/></svg></button>
  <span class="tl-label">Year<br>(Dec 31)</span>
  <div class="years" id="years" role="group" aria-label="Year"></div>
  <span class="vsep" aria-hidden="true"></span>
  <span class="tl-label">Scenario</span>
  <div class="seg" id="scn" role="group" aria-label="Scenario">
    <button type="button" data-scn="low" aria-pressed="false">Low</button>
    <button type="button" data-scn="median" aria-pressed="true">Median</button>
    <button type="button" data-scn="high" aria-pressed="false">High</button>
  </div>
</section>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="radar_panels.js"></script>
<script src="overlays.js"></script>
<script>
const D = window.PROTO_DATA;
const OVERLAYS = window.OVERLAYS || {};
const RADAR = window.RADAR_PANELS || [];
const state = { y: 0, scn: "median", w: [1, 1, 1], selected: null };
const fmt = n => n == null ? "n/a" : Math.round(n).toLocaleString("en-US");
const fmt1 = n => n == null ? "n/a" : (Math.abs(n) < 10 ? n.toFixed(1) : Math.round(n).toLocaleString("en-US"));
const pct = n => n == null ? "n/a" : (n >= 10 ? Math.round(n * 100).toLocaleString("en-US") + "%" : (n * 100).toFixed(n < 0.01 ? 2 : 1) + "%");
const dist = m => m == null ? "none within 100 km" : m === 0 ? "touching or inside" : m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1)} km`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const title = s => esc(String(s || "").toLowerCase().replace(/\b\w/g, c => c.toUpperCase()));
const SCN = D.scenarios, YEARS = D.years;
const srcById = Object.fromEntries(D.sources.map(s => [s.id, s]));
const siteById = Object.fromEntries(D.sites.map(s => [s.id, s]));
const radarById = Object.fromEntries(RADAR.map(p => [p.id, p]));
const RADAR_FOR_SITE = { "ANN-STARGATE-SHACKELFORD": "FRONTIER-SHACKELFORD", "ANN-STARGATE-DONAANA": "JUPITER-DONAANA",
                         "ANN-STARGATE-LORDSTOWN": "LORDSTOWN" };
const SITE_FOR_RADAR = Object.fromEntries(Object.entries(RADAR_FOR_SITE).map(([a, b]) => [b, a]));
const placed = D.sites.filter(s => s.lat != null && !s.location.missing);
const isNarrow = () => matchMedia("(max-width: 860px)").matches;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- F7 pressure index and its color ---------------- */
function pressure(src) {
  const maxShare = Math.max(...D.sources.map(s => s.share[state.scn][state.y]), 1e-9);
  const parts = [src.share[state.scn][state.y] / maxShare, src.decline_score ?? 0, src.stress_norm ?? 0];
  const wsum = state.w.reduce((a, b) => a + b, 0);
  return wsum ? parts.reduce((acc, v, i) => acc + v * state.w[i], 0) / wsum : 0;
}
const STOPS = [[41, 182, 246], [255, 213, 79], [229, 57, 53]];
function pcolor(t) {
  t = Math.max(0, Math.min(1, t || 0));
  const [a, b, k] = t < .5 ? [STOPS[0], STOPS[1], t * 2] : [STOPS[1], STOPS[2], (t - .5) * 2];

function bandChart(series, label, color, unit) {

}

function chart(sr) {
  const W = 340, H = 140, L0 = 44, R0 = 8, T0 = 8, B0 = 22;
  const t = sr.t.map(d => Date.parse(d)), v = sr.v;
  const tmin = Math.min(...t), tmax = Math.max(...t);
  const kept = v.filter((_, i) => sr.keep[i]);
  let vmin = Math.min(...kept), vmax = Math.max(...kept);
  const pad = (vmax - vmin) * 0.1 || 1; vmin -= pad; vmax += pad;
  const X = x => L0 + (x - tmin) / (tmax - tmin || 1) * (W - L0 - R0);
  const Y = y => T0 + (vmax - Math.max(vmin, Math.min(vmax, y))) / (vmax - vmin) * (H - T0 - B0);
  const t0 = Date.parse(sr.fit.t0), yr = 365.25 * 864e5;
  const fy = x => sr.fit.at_t0 + sr.fit.per_year * (x - t0) / yr;
  const yl = n => sr.unit === "mm" ? n.toFixed(0) : n.toFixed(1);
  const grid = [0, 1 / 3, 2 / 3, 1].map(f => { const yv = vmin + (vmax - vmin) * f;
    return `<line x1="${L0}" x2="${W - R0}" y1="${Y(yv)}" y2="${Y(yv)}" stroke="#E6E8EB"/><text x="${L0 - 6}" y="${Y(yv) + 3.5}" font-size="10" text-anchor="end" fill="#646B73">${yl(yv)}</text>`; }).join("");
  let xt = "";
  for (let y = new Date(tmin).getUTCFullYear() + 1; y <= new Date(tmax).getUTCFullYear(); y++)
    xt += `<text x="${X(Date.UTC(y, 0, 1))}" y="${H - 6}" font-size="10" text-anchor="middle" fill="#646B73">${y}</text>`;
  const pts = t.map((x, i) => sr.keep[i] ? `<circle cx="${X(x).toFixed(1)}" cy="${Y(v[i]).toFixed(1)}" r="2.2" fill="#1A73E8"/>`
    : `<circle cx="${X(x).toFixed(1)}" cy="${Y(v[i]).toFixed(1)}" r="2.2" fill="none" stroke="#9AA1A9"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sr.label)}, ${sr.t[0]} to ${sr.t[sr.t.length - 1]}">
    ${grid}${xt}${pts}<line x1="${X(tmin)}" y1="${Y(fy(tmin))}" x2="${X(tmax)}" y2="${Y(fy(tmax))}" stroke="#E53935" stroke-width="1.8"/></svg>`;
}
const TREND_TEXT = {

    sky: { "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 1, 5, 1, 7, 0] },
    sources: {
      imagery: { type: "raster", tileSize: 256, maxzoom: 19, tiles: [`${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`],
                 attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community" },
      roads: { type: "raster", tileSize: 256, maxzoom: 19, tiles: [`${ESRI}/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}`] },
      places: { type: "raster", tileSize: 256, maxzoom: 19, tiles: [`${ESRI}/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}`],
                attribution: "Labels &copy; Esri" },
      dem: { type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 14,
             tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
             attribution: "Terrain: Mapzen, AWS Terrain Tiles" }
    },
    layers: [
      { id: "space", type: "background", paint: { "background-color": "#000" } },
      { id: "imagery", type: "raster", source: "imagery", paint: { "raster-fade-duration": 200 } },
      { id: "roads", type: "raster", source: "roads", minzoom: 9, paint: { "raster-opacity": ["interpolate", ["linear"], ["zoom"], 9, 0, 11, .55, 15, .4] } },
      { id: "places", type: "raster", source: "places", minzoom: 2.5, paint: { "raster-opacity": .95 } }
    ],
    terrain: { source: "dem", exaggeration: 1.4 }
  },
  center: [-98, 39], zoom: 1.4, pitch: 0, bearing: 0, maxPitch: 75,
  attributionControl: { compact: true }
});
map.addControl(new maplibregl.ScaleControl({ unit: "imperial" }), "bottom-left");

const linkFeatures = placed.filter(s => srcById[s.source_id]).map(s => {
  const src = srcById[s.source_id];
  return { type: "Feature", properties: { site: s.id, src: src.id },
           geometry: { type: "LineString", coordinates: [[s.lon, s.lat], [src.lon, src.lat]] } };
});
const exposureFC = { type: "FeatureCollection", features: [] };
for (const o of [...placed, ...D.sources]) {
  const e = o.exposure; if (!e || o.lat == null) continue;
  const w = e.wetland_vegetated_m != null && e.wetland_vegetated_m <= 100, p = e.protected_m != null && e.protected_m <= 1000;
  const props = k => ({ k, id: o.id, kind: o.water_body ? "src" : "site" });
  if (w) exposureFC.features.push({ type: "Feature", properties: props("w"), geometry: { type: "Point", coordinates: [o.lon, o.lat] } });
  if (p) exposureFC.features.push({ type: "Feature", properties: props("p"), geometry: { type: "Point", coordinates: [o.lon, o.lat] } });
}
function sitesFC() {
  return { type: "FeatureCollection", features: placed.map((s, k) => ({ type: "Feature", id: k,
    properties: { id: s.id, name: s.name, built: s.status === "built", active: activeNow(s),
                  r: 5 + Math.sqrt(Math.max(acresNow(s), 0)) * 0.22 },
    geometry: { type: "Point", coordinates: [s.lon, s.lat] } })) };
}
function sourcesFC() {
  return { type: "FeatureCollection", features: D.sources.map((s, k) => ({ type: "Feature", id: k,
    properties: { id: s.id, name: s.water_body, color: pcolor(pressure(s)) }, geometry: { type: "Point", coordinates: [s.lon, s.lat] } })) };
}
const outlinesFC = { type: "FeatureCollection", features: placed.filter(s => s.outline).map(s => ({ type: "Feature",
  properties: { id: s.id, built: s.status === "built" }, geometry: s.outline })) };
const radarFC = { type: "FeatureCollection", features: RADAR.map(p => ({ type: "Feature", properties: { id: p.id, label: p.kind === "site" ? "NISAR radar view" : "NISAR ground motion" },
  geometry: { type: "Point", coordinates: [p.lon, p.lat] } })) };

const TEXT = { "text-font": ["Open Sans Semibold"], "text-size": 12.5, "text-offset": [0, 1.25], "text-anchor": "top", "text-max-width": 11, "text-optional": true };
const HALO = { "text-color": "#fff", "text-halo-color": "rgba(0,0,0,.85)", "text-halo-width": 1.4, "text-halo-blur": .4 };

map.on("load", () => {
  // Radar-measured change: one image per built campus, drawn pixel-sharp on the photo.
  for (const [id, o] of Object.entries(OVERLAYS)) {
    map.addSource("ov-" + id, { type: "image", url: o.file, coordinates: o.coords });
    map.addLayer({ id: "ov-" + id, type: "raster", source: "ov-" + id, minzoom: 10,
      paint: { "raster-resampling": "nearest", "raster-fade-duration": 0, "raster-opacity": ["interpolate", ["linear"], ["zoom"], 10.5, 0, 12.5, 1] } }, "places");
  }
  map.addSource("outlines", { type: "geojson", data: outlinesFC });
  map.addLayer({ id: "outline-fill", type: "fill", source: "outlines", minzoom: 9, paint: { "fill-color": "#FFD678", "fill-opacity": ["interpolate", ["linear"], ["zoom"], 9, 0, 11, .06] } }, "places");
  map.addLayer({ id: "outline-shadow", type: "line", source: "outlines", minzoom: 9, paint: { "line-color": "#000", "line-opacity": .45, "line-width": 4, "line-blur": 2 } });
  map.addLayer({ id: "outline", type: "line", source: "outlines", minzoom: 9,
    paint: { "line-color": "#FFD678", "line-width": ["interpolate", ["linear"], ["zoom"], 9, 1, 15, 2.5], "line-dasharray": [2, 1.5] } });

  map.addSource("links", { type: "geojson", data: { type: "FeatureCollection", features: linkFeatures } });
  map.addLayer({ id: "link-glow", type: "line", source: "links", filter: ["==", "site", "__none__"],
    paint: { "line-color": "#000", "line-opacity": .45, "line-width": 5, "line-blur": 3 } });
  map.addLayer({ id: "link", type: "line", source: "links", filter: ["==", "site", "__none__"],
    layout: { "line-cap": "round" }, paint: { "line-color": "#fff", "line-width": 2, "line-dasharray": [2, 2] } });

  map.addSource("exposure", { type: "geojson", data: exposureFC });
  map.addLayer({ id: "exposure", type: "circle", source: "exposure", layout: { visibility: "none" },
    paint: { "circle-radius": ["case", ["==", ["get", "k"], "w"], 15, 20], "circle-opacity": 0,
             "circle-stroke-width": 2.5, "circle-stroke-color": ["case", ["==", ["get", "k"], "w"], "#43C08A", "#A47BE6"],
             "circle-stroke-opacity": ["interpolate", ["linear"], ["zoom"], 12, 1, 13.5, 0] } });

  map.addSource("sources", { type: "geojson", data: sourcesFC() });
  map.addLayer({ id: "src-halo", type: "circle", source: "sources",
    paint: { "circle-radius": 13, "circle-color": ["get", "color"], "circle-opacity": .3, "circle-blur": .6 } });
  map.addLayer({ id: "src", type: "circle", source: "sources",
    paint: { "circle-radius": ["case", ["boolean", ["feature-state", "hover"], false], 8.5, 7], "circle-color": ["get", "color"],
             "circle-stroke-color": "#fff", "circle-stroke-width": 2.2 } });
  map.addLayer({ id: "src-label", type: "symbol", source: "sources", minzoom: 6.5,
    layout: { ...TEXT, "text-field": ["get", "name"] }, paint: { ...HALO, "text-color": "#D7F1FF" } });

  map.addSource("sites", { type: "geojson", data: sitesFC() });
  const fadeOut = ["interpolate", ["linear"], ["zoom"], 11.5, 1, 13, 0];
  map.addLayer({ id: "site", type: "circle", source: "sites",
    paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 2, ["*", ["get", "r"], .5], 5, ["get", "r"]],
             "circle-color": ["case", ["get", "built"], "#F5A623", ["get", "active"], "#FFE2A8", "#FFFFFF"],
             "circle-opacity": ["interpolate", ["linear"], ["zoom"], 11.5, ["case", ["get", "active"], 1, .55], 13, 0],
             "circle-stroke-color": ["case", ["get", "built"], "#FFFFFF", "#F5A623"],
             "circle-stroke-width": ["case", ["boolean", ["feature-state", "hover"], false], 3.5, 2],
             "circle-stroke-opacity": fadeOut } });
  map.addLayer({ id: "site-label", type: "symbol", source: "sites", minzoom: 6,
    layout: { ...TEXT, "text-field": ["get", "name"], "text-offset": [0, 1.1] }, paint: { ...HALO, "text-opacity": ["interpolate", ["linear"], ["zoom"], 6, 0, 6.6, 1] } });

  map.addSource("radar", { type: "geojson", data: radarFC });
  map.addLayer({ id: "radar", type: "symbol", source: "radar", minzoom: 4.5,
    layout: { "text-field": ["get", "label"], "text-font": ["Open Sans Semibold"], "text-size": 11, "text-anchor": "bottom", "text-offset": [0, -1.3] },
    paint: { "text-color": "#1F2328", "text-halo-color": "#C5E1A5", "text-halo-width": 6 } });

  for (const id of ["site", "src", "radar", "outline-fill"]) {
    map.on("mouseenter", id, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", id, () => { map.getCanvas().style.cursor = ""; popup.remove(); clearHover(); });
  }
  map.on("mousemove", "site", e => hover(e, "sites", f => { const s = siteById[f.properties.id];
    return `<b>${esc(s.name)}</b><small>${s.status === "built" ? "Built" : "Announced"}${s.projected ? ` · ${fmt(acresNow(s))} acres, ${fmt(s.water_ml[state.scn][state.y])} ML/yr in ${YEARS[state.y]}` : ""}</small>`; }));
  map.on("mousemove", "src", e => hover(e, "sources", f => { const s = srcById[f.properties.id];
    return `<b>${esc(s.water_body)}</b><small>Water source · pressure index ${pressure(s).toFixed(2)}</small>`; }));
  map.on("click", "site", e => select("site", e.features[0].properties.id));
  map.on("click", "outline-fill", e => select("site", e.features[0].properties.id));
  map.on("click", "src", e => select("src", e.features[0].properties.id));
  map.on("click", "radar", e => select("radar", e.features[0].properties.id));
  map.on("click", "exposure", e => { const p = e.features[0].properties; select(p.kind, p.id); });

  applyLayers();
  document.getElementById("intro").classList.add("done");
  setTimeout(() => { if (!state.selected) home(still ? 0 : 4200); }, 500);
});

const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12 });
let hovered = null;
function clearHover() { if (hovered) map.setFeatureState({ source: hovered[0], id: hovered[1] }, { hover: false }); hovered = null; }
function hover(e, source, html) {
  const f = e.features[0];
  if (!hovered || hovered[0] !== source || hovered[1] !== f.id) { clearHover(); hovered = [source, f.id]; map.setFeatureState({ source, id: f.id }, { hover: true }); }
  if (matchMedia("(hover: hover)").matches) popup.setLngLat(f.geometry.coordinates).setHTML(html(f)).addTo(map);
}

const US = [[-124.8, 24.5], [-66.9, 49.4]];
function pad() { return isNarrow() ? { top: 70, bottom: Math.round(innerHeight * .42) + 70, left: 20, right: 20 } : { top: 60, bottom: 90, left: 420, right: 70 }; }
function home(duration = 2400) { map.fitBounds(US, { padding: pad(), pitch: 0, bearing: 0, duration, essential: true }); }
function bboxOf(coords) {
  const xs = coords.map(c => c[0]), ys = coords.map(c => c[1]);
  return [[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]];
}
function flatten(g) { return g.type === "Polygon" ? g.coordinates.flat() : g.coordinates.flat(2); }
function flyToSite(s) {
  const ov = OVERLAYS[s.id];
  const pts = [...(s.outline ? flatten(s.outline) : []), ...(ov ? ov.coords : [])];
  if (pts.length) map.fitBounds(bboxOf(pts), { padding: pad(), pitch: 52, bearing: -15, maxZoom: 16, duration: still ? 0 : 3200, essential: true });
  else map.flyTo({ center: [s.lon, s.lat], zoom: 13.5, pitch: 52, bearing: -15, padding: pad(), duration: still ? 0 : 3200, essential: true });
}
function select(kind, id) {
  const o = objOf(kind, id); if (!o) return;
  state.selected = [kind, id];
  closeResults();
  if (kind === "site" && o.lat != null) flyToSite(o);
  else if (kind === "src") {
    const linked = placed.filter(s => s.source_id === id);
    map.fitBounds(bboxOf([[o.lon, o.lat], ...linked.map(s => [s.lon, s.lat])]), { padding: pad(), pitch: 45, bearing: -10, maxZoom: 11.5, duration: still ? 0 : 3000, essential: true });
  } else if (kind === "radar") {
    const site = siteById[SITE_FOR_RADAR[id]];
    if (site) flyToSite(site); else map.flyTo({ center: [o.lon, o.lat], zoom: 11, pitch: 50, padding: pad(), duration: still ? 0 : 3000, essential: true });
  }
  showDetail(); showLinks();
}
function goHome() { state.selected = null; showHome(); showLinks(); home(); }
function showLinks() {
  if (!map.getLayer("link")) return;
  let f = ["==", "site", "__none__"];
  if (state.selected) {
    const [kind, id] = state.selected;
    if (kind === "site") f = ["==", "site", id];
    else if (kind === "src") f = ["==", "src", id];
    else if (SITE_FOR_RADAR[id]) f = ["==", "site", SITE_FOR_RADAR[id]];
  }
  map.setFilter("link", f); map.setFilter("link-glow", f);
}

const LAYERS = {
  lyrChange: () => Object.keys(OVERLAYS).map(id => "ov-" + id),
  lyrSites: () => ["site", "site-label", "outline", "outline-fill", "outline-shadow"],
  lyrWater: () => ["src", "src-halo", "src-label", "link", "link-glow"],
  lyrRadar: () => ["radar"], lyrExposure: () => ["exposure"], lyrLabels: () => ["places", "roads"]
};
function applyLayers() {
  for (const [el, ids] of Object.entries(LAYERS)) {
    const on = document.getElementById(el).checked;
    for (const id of ids()) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
  }
  map.setTerrain(document.getElementById("lyrTerrain").checked ? { source: "dem", exaggeration: 1.4 } : null);
}
Object.keys(LAYERS).concat("lyrTerrain").forEach(id => document.getElementById(id).addEventListener("change", applyLayers));

/* ---------------- controls ---------------- */
function render() {
  document.querySelectorAll("#years button").forEach((b, k) => b.setAttribute("aria-pressed", k === state.y));
  if (map.getSource("sites")) { map.getSource("sites").setData(sitesFC()); map.getSource("sources").setData(sourcesFC()); }
  showDetail();
}
document.getElementById("years").innerHTML = YEARS.map((y, k) => `<button type="button" aria-pressed="${k === 0}">${y}</button>`).join("");
document.querySelectorAll("#years button").forEach((b, k) => b.addEventListener("click", () => { stopPlay(); state.y = k; render(); }));
document.querySelectorAll("#scn button").forEach(b => b.addEventListener("click", () => {
  state.scn = b.dataset.scn; document.querySelectorAll("#scn button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); }));
["w1", "w2", "w3"].forEach((id, k) => document.getElementById(id).addEventListener("input", e => {
  state.w[k] = +e.target.value; document.getElementById(id + "o").textContent = e.target.value; render(); }));
let playTimer = null;
const PLAY = '<path d="M4 2v12l10-6z"/>', PAUSE = '<path d="M3.5 2h3v12h-3zM9.5 2h3v12h-3z"/>';
function stopPlay() { clearInterval(playTimer); playTimer = null; document.getElementById("playIcon").innerHTML = PLAY; }
document.getElementById("play").addEventListener("click", () => {
  if (playTimer) return stopPlay();
  if (state.y === YEARS.length - 1) { state.y = 0; render(); }
  document.getElementById("playIcon").innerHTML = PAUSE;
  playTimer = setInterval(() => { if (state.y >= YEARS.length - 1) return stopPlay(); state.y++; render(); }, 1400);
});
const layersCard = document.getElementById("layers"), layersBtn = document.getElementById("layersBtn");
layersBtn.addEventListener("click", () => { layersCard.classList.add("on"); layersBtn.style.display = "none"; layersBtn.setAttribute("aria-expanded", "true"); });
document.getElementById("layersClose").addEventListener("click", () => { layersCard.classList.remove("on"); layersBtn.style.display = ""; layersBtn.setAttribute("aria-expanded", "false"); });
document.getElementById("zin").addEventListener("click", () => map.zoomIn());
document.getElementById("zout").addEventListener("click", () => map.zoomOut());
document.getElementById("compass").addEventListener("click", () => map.easeTo({ bearing: 0, duration: 600 }));
document.getElementById("tilt").addEventListener("click", () => map.easeTo({ pitch: map.getPitch() > 10 ? 0 : 60, duration: 900 }));
map.on("rotate", () => document.getElementById("needle").style.transform = `rotate(${-map.getBearing()}deg)`);
map.on("pitch", () => document.getElementById("tilt").textContent = map.getPitch() > 10 ? "2D" : "3D");
document.getElementById("homeBtn").addEventListener("click", goHome);
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeResults(); if (state.selected) goHome(); } });

// Search
const searchable = [...placed.map(s => ({ kind: "site", id: s.id, name: s.name, sub: s.status === "built" ? "Built campus" : "Announced campus", color: "#F5A623" })),
                    ...D.sources.map(s => ({ kind: "src", id: s.id, name: s.water_body, sub: "Water source · " + title(s.utility), color: "#29B6F6" }))];
const box = document.getElementById("search"), results = document.getElementById("results");
let hits = [], hi = 0;
function closeResults() { results.classList.remove("on"); }
function drawResults() {
  results.innerHTML = hits.map((h, k) => `<button role="option" class="${k === hi ? "hi" : ""}" data-k="${k}"><span class="ic" style="background:${h.color}"></span>
    <span>${esc(h.name)}<small>${h.sub}</small></span></button>`).join("") || `<p class="note" style="padding:6px 16px;margin:0">No match</p>`;
  results.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { const h = hits[+b.dataset.k]; box.value = ""; select(h.kind, h.id); }));
  results.classList.add("on");
}
box.addEventListener("input", () => { const q = box.value.trim().toLowerCase(); if (!q) return closeResults();
  hits = searchable.filter(h => h.name.toLowerCase().includes(q) || h.sub.toLowerCase().includes(q)).slice(0, 8); hi = 0; drawResults(); });
box.addEventListener("keydown", e => {
  if (!results.classList.contains("on")) return;
  if (e.key === "ArrowDown") { hi = Math.min(hits.length - 1, hi + 1); drawResults(); e.preventDefault(); }
  if (e.key === "ArrowUp") { hi = Math.max(0, hi - 1); drawResults(); e.preventDefault(); }
  if (e.key === "Enter" && hits[hi]) { const h = hits[hi]; box.value = ""; select(h.kind, h.id); box.blur(); }
});
document.addEventListener("click", e => { if (!results.contains(e.target) && e.target !== box) closeResults(); });

showHome();
window.__map = map; window.__select = select;
</script>
</body>
</html>
