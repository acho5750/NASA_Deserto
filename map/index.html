<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Centers and Water</title>
<meta name="description" content="What US data center campuses took from the land, what NASA's NISAR radar sees now, the water sources they depend on, and what announced projects add by 2035.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --linen: #EFEAE0; --ivory: #FAF8F3; --paper: #F5F1E8; --rule: #DCD4C5; --rule2: #CFC6B4;
    --ink: #1D1C1A; --ink2: #3A3731; --muted: #6F675A; --faint: #A39A8B;
    --rust: #C2461B; --ember: #FF5A1F; --ochre: #B9832A; --crimson: #8E1F1F; --teal: #2C6A66;
    /* one color per satellite, used everywhere: chips, lanes, charts, map */
    --s1: #3E6A96; --nisar: #8A2BE2; --swot: #12808F; --opera: #6F8FB0; --proj: #B9832A;
    --lc-developed: #8F8A80; --lc-cropland: #D9A93A; --lc-pasture_hay: #E3D08A; --lc-forest: #3F6E45;
    --lc-shrub_grass: #9DB07A; --lc-barren: #C9B79A; --lc-wetlands: #4E9A9C; --lc-water: #3D74AE;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.5 var(--sans); color: var(--ink); background: var(--linen); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; }
  a { color: var(--teal); }
  :focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
  .cap { font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  .app { height: 100vh; display: grid; grid-template-rows: 56px 1fr; }
  header { display: flex; align-items: center; gap: 20px; padding: 0 18px; border-bottom: 1px solid var(--rule); background: var(--ivory); min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .brand .logo { width: 22px; height: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .brand .logo i { background: var(--ink); } .brand .logo i:nth-child(2) { background: var(--rust); } .brand .logo i:nth-child(3) { background: var(--swot); } .brand .logo i:nth-child(4) { background: var(--nisar); }
  nav.chapters { display: flex; gap: 2px; flex: 1; min-width: 0; }
  nav.chapters button { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; padding: 8px 14px 8px 10px; cursor: pointer; border-radius: 3px; white-space: nowrap; color: var(--muted); }
  nav.chapters button b { font: 600 11px/20px var(--mono); width: 20px; height: 20px; text-align: center; border: 1px solid var(--rule2); border-radius: 50%; color: var(--muted); }
  nav.chapters button span { font-weight: 600; font-size: 13.5px; }
  nav.chapters button small { display: block; font: 500 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  nav.chapters button:hover { background: var(--linen); }
  nav.chapters button[aria-current=true] { background: var(--ink); color: var(--ivory); }
  nav.chapters button[aria-current=true] b { background: var(--ivory); color: var(--ink); border-color: var(--ivory); }
  nav.chapters button[aria-current=true] small { color: #CFC6B4; }
  nav.chapters button[data-ch=nisar] small { color: var(--nisar); font-weight: 600; }
  nav.chapters button[data-ch=nisar][aria-current=true] { background: var(--nisar); }
  nav.chapters button[data-ch=nisar][aria-current=true] small { color: #EBD9FF; }
  .aboutbtn { border: 1px solid var(--rule2); background: transparent; padding: 6px 12px; cursor: pointer; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-radius: 3px; }

  .main { display: grid; grid-template-columns: 430px 1fr; min-height: 0; }
  #story { min-height: 0; overflow-y: auto; background: var(--ivory); border-right: 1px solid var(--rule); scrollbar-width: thin; scrollbar-color: var(--rule2) transparent; }
  .center { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; }
  .mapwrap { position: relative; min-height: 0; background: #D9D2C2; overflow: hidden; }
  #map, #mapB { position: absolute; inset: 0; }
  #mapB { pointer-events: none; display: none; z-index: 2; }
  #mapB.on { display: block; }

  /* sensor chips */
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 600 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px 5px 7px; border-radius: 2px; color: #fff; background: var(--c); white-space: nowrap; vertical-align: middle; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
  .chip.s1 { --c: var(--s1); } .chip.nisar { --c: var(--nisar); } .chip.swot { --c: var(--swot); } .chip.opera { --c: var(--opera); }
  .chip.proj { --c: transparent; color: #8A621B; border: 1px dashed var(--proj); padding: 4px 7px 4px 6px; }
  .chip.data { --c: transparent; color: var(--muted); border: 1px solid var(--rule2); padding: 4px 7px 4px 6px; }
  .chip.data::before { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }

  /* story panel */
  .ch { padding: 22px 24px 8px; }
  .kicker { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .kicker .n { font: 600 11px/22px var(--mono); width: 24px; height: 24px; text-align: center; border-radius: 50%; background: var(--ink); color: var(--ivory); }
  h1 { font-size: 23px; line-height: 1.22; letter-spacing: -.015em; margin: 0 0 8px; font-weight: 700; }
  h2 { font-size: 18px; line-height: 1.3; margin: 0 0 4px; font-weight: 650; }
  h3 { margin: 22px 0 10px; font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  h3::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .lede { font-size: 15px; color: var(--ink2); margin: 0 0 4px; }
  p { margin: 0 0 10px; color: var(--ink2); }
  .big { font: 600 44px/1 var(--mono); letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin: 18px 0 4px; }
  .big small { font: 500 14px var(--sans); letter-spacing: 0; color: var(--muted); margin-left: 6px; }
  .big.stack small, .headline .hbig.stack small { display: block; margin: 6px 0 0; }
  .bigl { font-size: 14px; color: var(--ink2); margin: 0 0 4px; }
  .range { font: 500 11.5px var(--mono); color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .srcline { font-size: 11px; color: var(--muted); margin: 6px 0 0; line-height: 1.5; }
  .srcline a { color: var(--muted); }
  code { font: 11px var(--mono); background: var(--linen); padding: 1px 4px; }
  .next { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 26px 0 18px; padding-top: 16px; border-top: 1px solid var(--rule); }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--ink); background: transparent; padding: 9px 14px; cursor: pointer;
         font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); border-radius: 2px; }
  .btn:hover { background: var(--ink); color: var(--ivory); }
  .btn.solid { background: var(--ink); color: var(--ivory); }
  .btn.solid:hover { background: #000; }
  .btn.violet { border-color: var(--nisar); background: var(--nisar); color: #fff; }
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--teal); cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: rgba(44, 106, 102, .35); }
  .back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; margin-bottom: 14px; cursor: pointer; font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .back:hover { color: var(--ink); }

  /* unit grids: one square = N acres, one figure = N people */
  .ugrid { display: flex; flex-wrap: wrap; gap: 2px; margin: 10px 0 8px; }
  .ugrid i { width: 9px; height: 9px; background: var(--c); display: block; }
  .ugrid i.ghost { background: transparent; outline: 1px dashed var(--proj); outline-offset: -1px; }
  .ulegend { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 12.5px; color: var(--ink2); }
  .ulegend span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 8px; background: var(--c); vertical-align: -1px; }
  .ulegend b { font: 500 12px var(--mono); text-align: right; color: var(--ink2); font-weight: 500; }
  .people { display: flex; flex-wrap: wrap; gap: 3px 2px; margin: 12px 0 6px; }
  .people svg { width: 11px; height: 22px; display: block; }
  .people svg.new { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translateY(-4px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

  .card { border: 1px solid var(--rule); background: var(--paper); padding: 12px 14px; margin: 10px 0; }
  .card.nis { border-color: rgba(138, 43, 226, .35); background: #F7F2FB; }
  .card h4 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card h4 button { font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; border: 1px solid currentColor; color: var(--nisar); background: transparent; padding: 3px 7px; cursor: pointer; border-radius: 2px; white-space: nowrap; }
  .card img { width: 100%; display: block; border: 1px solid var(--rule2); margin-top: 8px; }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }

  .rank { width: 100%; border: 0; background: transparent; padding: 8px 0; display: grid; grid-template-columns: 1fr 92px; gap: 2px 12px; text-align: left; cursor: pointer; border-top: 1px solid var(--rule); }
  .rank:hover { background: var(--linen); }
  .rank .nm { font-size: 13px; line-height: 1.3; }
  .rank .nm small { display: block; color: var(--muted); font-size: 11.5px; }
  .rank .v { font: 600 14px var(--mono); text-align: right; }
  .rank .v small { display: block; font: 500 10px var(--mono); color: var(--muted); }
  .rank .barw { grid-column: 1 / -1; position: relative; height: 10px; background: var(--linen); }
  .rank .barw i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); }
  .rank .barw u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); text-decoration: none; }
  .spark { width: 92px; height: 30px; }

  .sensor { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--rule); }
  .sensor i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-top: 5px; }
  .sensor b { font-size: 13px; }
  .sensor p { margin: 1px 0 0; font-size: 12.5px; }

  .lcbar { display: flex; height: 10px; margin: 8px 0 6px; }

  /* headline over the map */
  .headline { position: absolute; z-index: 6; top: 14px; left: 14px; max-width: 360px; background: rgba(250, 248, 243, .96); border: 1px solid var(--rule2);
              box-shadow: 0 8px 28px rgba(40, 30, 10, .16); padding: 12px 16px 12px; }
  .headline .when { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
  .headline .hbig { font: 600 32px/1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .headline .hbig small { font: 500 13px var(--sans); color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  .headline .hl { font-size: 12.5px; color: var(--ink2); margin: 5px 0 0; }
  .headline .hl2 { font-size: 12px; color: #8A621B; margin: 4px 0 0; }
  .legend { position: absolute; z-index: 6; left: 14px; bottom: 30px; background: rgba(250, 248, 243, .95); border: 1px solid var(--rule2); padding: 8px 11px; font-size: 12px; color: var(--ink2); max-width: 330px; }
  .legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .legend .sw { flex: none; width: 11px; height: 11px; background: var(--c); }
  .legend .sw.r { border-radius: 50%; } .legend .sw.ring { border-radius: 50%; background: transparent; border: 2.5px solid var(--nisar); }
  .mapbtns { position: absolute; z-index: 6; right: 12px; top: 12px; display: flex; flex-direction: column; border: 1px solid var(--rule2); background: var(--ivory); }
  .mapbtns button { width: 32px; height: 32px; border: 0; background: transparent; cursor: pointer; font: 500 16px var(--mono); color: var(--ink2); }
  .mapbtns button + button { border-top: 1px solid var(--rule2); }

  /* before / after swipe */
  .swipe { position: absolute; z-index: 5; top: 0; bottom: 0; width: 0; display: none; }
  .swipe.on { display: block; }
  .swipe .bar { position: absolute; top: 0; bottom: 0; left: -1.5px; width: 3px; background: var(--ivory); box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .swipe .knob { position: absolute; top: 50%; left: -22px; width: 44px; height: 44px; margin-top: -22px; border-radius: 50%; background: var(--ivory); border: 2px solid var(--ink);
                 cursor: ew-resize; display: grid; place-items: center; font: 600 15px var(--mono); touch-action: none; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .phototag { position: absolute; z-index: 6; bottom: 30px; padding: 6px 10px; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--ivory); display: none; }
  .phototag.on { display: block; }
  .phototag small { display: block; font: 500 10px var(--mono); color: #CFC6B4; letter-spacing: .04em; text-transform: none; }
  #tagB { left: 14px; bottom: 44px; } #tagA { right: 54px; bottom: 44px; text-align: right; }
  .phototag.a { background: var(--rust); }

  /* time bar with one lane per satellite */
  .timebar { border-top: 1px solid var(--rule); background: var(--ivory); display: grid; grid-template-columns: 170px 1fr; }
  .tctl { padding: 12px 14px 12px 16px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
  #clock { font: 600 26px/1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  #clockSub { font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
  #play { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--ink); color: var(--ivory); padding: 9px 14px; cursor: pointer;
          font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; border-radius: 2px; }
  .lanes { position: relative; padding: 8px 18px 4px 8px; cursor: pointer; user-select: none; min-width: 0; }
  .lanes svg { display: block; width: 100%; height: 132px; overflow: visible; }

  .maplibregl-ctrl-attrib { background: rgba(250, 248, 243, .85) !important; font: 10px var(--sans); }
  .maplibregl-popup-content { border-radius: 0; padding: 8px 10px; background: var(--ink); color: var(--ivory); font: 12.5px/1.4 var(--sans); box-shadow: none; }
  .maplibregl-popup-content small { display: block; color: #CFC6B4; font: 11px var(--mono); margin-top: 2px; }
  .maplibregl-popup-tip { display: none; }

  dialog { border: 1px solid var(--rule2); background: var(--ivory); max-width: 680px; padding: 22px 26px; color: var(--ink); }
  dialog::backdrop { background: rgba(29, 28, 26, .4); }
  dialog p { font-size: 13px; }

  @media (max-width: 1180px) { nav.chapters button small { display: none; } .main { grid-template-columns: 380px 1fr; } }
  @media (max-width: 860px) {
    body { overflow: auto; }
    .app { height: auto; display: block; }
    header { flex-wrap: wrap; height: auto; padding: 10px 12px; gap: 8px; }
    nav.chapters { order: 3; flex-basis: 100%; overflow-x: auto; }
    nav.chapters button { padding: 6px 10px 6px 6px; } nav.chapters button span { font-size: 12.5px; }
    .main { display: flex; flex-direction: column; }
    .center { order: 1; grid-template-rows: 58vh auto; }
    #story { order: 2; overflow: visible; border-right: 0; }
    .ch { padding: 18px 16px 6px; }
    .headline { top: 8px; left: 8px; right: 8px; max-width: none; padding: 8px 10px; } .headline .hbig { font-size: 22px; } .headline .hl2 { display: none; }
    .legend, .mapbtns { display: none; }
    .timebar { grid-template-columns: 1fr; } .tctl { flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--rule); }
    .lanes { padding: 6px 12px 4px 4px; }
    .big { font-size: 36px; }
  }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Data Centers &amp; Water</div>
  <nav class="chapters" aria-label="Chapters">
    <button data-ch="land"><b>1</b><span>Land<small>2017-2026 · Sentinel-1</small></span></button>
    <button data-ch="nisar"><b>2</b><span>NISAR now<small>2026 · NASA NISAR</small></span></button>
    <button data-ch="water"><b>3</b><span>Water<small>SWOT · OPERA</small></span></button>
    <button data-ch="future"><b>4</b><span>2035<small>Projection</small></span></button>
  </nav>
  <button class="aboutbtn" id="aboutBtn">About the data</button>
</header>

<div class="main">
  <aside id="story" aria-live="polite"></aside>
  <section class="center">
    <div class="mapwrap" id="mapwrap">
      <div id="map" role="region" aria-label="Satellite map of US data center campuses and water sources"></div>
      <div id="mapB" aria-hidden="true"></div>
      <div class="swipe" id="swipe"><div class="bar"></div><div class="knob" id="knob" role="slider" tabindex="0" aria-label="Before and after photo divider">&#8596;</div></div>
      <div class="phototag" id="tagB"></div><div class="phototag a" id="tagA"></div>
      <div class="headline" id="headline"></div>
      <div class="legend" id="legend"></div>
      <div class="mapbtns"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="homeBtn" aria-label="Whole country" title="Whole country">&#8962;</button></div>
    </div>
    <div class="timebar">
      <div class="tctl">
        <div><div id="clock">2017</div><div id="clockSub">Measured</div></div>
        <button id="play" aria-label="Play"><svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" id="playIcon"><path d="M1 0v10l9-5z"/></svg><span id="playLbl">Play</span></button>
      </div>
      <div class="lanes" id="lanes" role="slider" tabindex="0" aria-label="Time"></div>
    </div>
  </section>
</div>
</div>

<dialog id="about"></dialog>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="radar_panels.js"></script>
<script src="timeline.js"></script>
<script src="wayback.js"></script>
<script src="story.js"></script>
<script>
const D = window.PROTO_DATA, TL = window.TIMELINE, RADAR = window.RADAR_PANELS || [], WB = window.WAYBACK || { sites: {} }, ST = window.STORY;
const fmt = n => n == null ? "n/a" : Math.round(n).toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const title = s => esc(String(s || "").toLowerCase().replace(/\b\w/g, c => c.toUpperCase()));
const short = n => n == null ? "n/a" : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + " million" : n >= 1e4 ? Math.round(n / 1e3).toLocaleString("en-US") + ",000" : fmt(n);
const times = x => x >= 1 ? (x >= 10 ? Math.round(x) : x.toFixed(1)) + "×" : Math.round(x * 100) + "%";
const YEARS = D.years, LAST = YEARS.length - 1;
const siteById = Object.fromEntries(D.sites.map(s => [s.id, s]));
const srcById = Object.fromEntries(D.sources.map(s => [s.id, s]));
const radarById = Object.fromEntries(RADAR.map(p => [p.id, p]));
const RADAR_FOR_SITE = { "ANN-STARGATE-SHACKELFORD": "FRONTIER-SHACKELFORD", "ANN-STARGATE-DONAANA": "JUPITER-DONAANA", "ANN-STARGATE-LORDSTOWN": "LORDSTOWN" };
const placed = D.sites.filter(s => s.lat != null && !s.location.missing);
const curveId = s => RADAR_FOR_SITE[s.id] || s.id;
const curveOf = s => TL.curves[curveId(s)];
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isNarrow = () => matchMedia("(max-width: 860px)").matches;

/* People's worth of water: the national public-supply use per person (USGS 2015), already a parameter of F5. */
const PER_CAPITA = D.params.per_capita_l_per_day;            // liters per person per day
const ML_PER_PERSON = PER_CAPITA * 365 / 1e6;               // megaliters per person per year
const people = ml => ml / ML_PER_PERSON;
const USGS = "https://doi.org/10.5066/F7TB15V5";

/* ---------------- time ----------------
   t = year*12 + month-1. Sentinel-1 area curves run TL.t0..TL.t1. Projection values sit at December 31 of each year (F8). */
const T0 = 2017 * 12, TEND = YEARS[LAST] * 12 + 11, T_MEAS1 = TL.t1, PROJ0 = YEARS[0] * 12 + 11;
const tOf = d => { const x = new Date(d + "T00:00:00Z"); return x.getUTCFullYear() * 12 + x.getUTCMonth(); };

/* ---------------- chapter 2: NISAR ---------------- */
function radarChart(n, s) {
  const W = 360, H = 150, L0 = 34, R0 = 6, gap = 14, h1 = 62, h2 = 46, top2 = 10 + h1 + gap;
  const all = [...n.s1.t, ...n.nisar.t].map(Date.parse), tmin = Math.min(...all), tmax = Math.max(...all);
  const X = d => L0 + (Date.parse(d) - tmin) / (tmax - tmin) * (W - L0 - R0);
  const lane = (vals, y0, h) => { let a = Math.min(...vals), b = Math.max(...vals); const p = (b - a) * .12 || 1; a -= p; b += p; return v => y0 + (b - v) / (b - a) * h; };
  const Y1 = lane(n.s1.v, 10, h1), Y2 = lane(n.nisar.v, top2, h2);
  const path = (t, v, Y) => t.map((d, i) => `${i ? "L" : "M"}${X(d).toFixed(1)},${Y(v[i]).toFixed(1)}`).join("");
  const cs = s.construction_start;
  let xt = ""; for (let y = new Date(tmin).getUTCFullYear() + 1; y <= new Date(tmax).getUTCFullYear(); y++) { const x = X(`${y}-01-01`); xt += `<text x="${x}" y="${H - 2}" font-size="9.5" text-anchor="middle" fill="#6F675A" font-family="IBM Plex Mono">${y}</text><line x1="${x}" x2="${x}" y1="8" y2="${H - 12}" stroke="#E6DFD1"/>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar brightness inside the campus: Sentinel-1 from ${n.s1.t[0]}, NISAR from ${n.nisar.t[0]}">
    ${xt}
    <text x="${L0}" y="6" font-size="9.5" fill="#3E6A96" font-family="IBM Plex Mono" font-weight="600">SENTINEL-1 · VV dB</text>
    <path d="${path(n.s1.t, n.s1.v, Y1)}" fill="none" stroke="#3E6A96" stroke-width="1.6"/>
    <text x="${L0}" y="${top2 - 4}" font-size="9.5" fill="#8A2BE2" font-family="IBM Plex Mono" font-weight="600">NISAR · HH dB · track ${esc(n.nisar.stack)}</text>
    <rect x="${X(n.nisar.t[0]) - 4}" y="${top2}" width="${W - R0 - X(n.nisar.t[0]) + 4}" height="${h2}" fill="#8A2BE2" opacity=".07"/>
    <path d="${path(n.nisar.t, n.nisar.v, Y2)}" fill="none" stroke="#8A2BE2" stroke-width="1.8"/>
    ${n.nisar.t.map((d, i) => `<circle cx="${X(d)}" cy="${Y2(n.nisar.v[i])}" r="2.6" fill="#8A2BE2"/>`).join("")}
    ${cs ? `<line x1="${X(cs)}" x2="${X(cs)}" y1="8" y2="${H - 12}" stroke="#1D1C1A" stroke-dasharray="3 2"/><text x="${X(cs) - 3}" y="18" font-size="9" text-anchor="end" fill="#1D1C1A" font-family="IBM Plex Mono">BUILD STARTS</text>` : ""}
  </svg>`;
}

/* ---------------- chapter 3: water ---------------- */
const trendWords = src => {
  if (src.trend_status !== "ok") return null;
  if (src.trend_unit === "m/yr") return { k: "swot", txt: `water level ${src.trend_value < 0 ? "falling" : "rising"} ${Math.abs(src.trend_value * 100).toFixed(1)} cm a year`, down: src.trend_value < 0 };
  return { k: "opera", txt: `ground ${src.trend_value < 0 ? "moving away from the satellite" : "moving toward the satellite"} ${Math.abs(src.trend_value).toFixed(1)} mm a year`, down: src.trend_value < 0 };
};
function sparkline(sr, color) {
  if (!sr) return "";
  const t = sr.t.map(Date.parse), v = sr.v.filter((_, i) => sr.keep[i]), tk = t.filter((_, i) => sr.keep[i]);
  const W = 92, H = 30, a = Math.min(...v), b = Math.max(...v), t0 = Math.min(...tk), t1 = Math.max(...tk);
  const X = x => (x - t0) / (t1 - t0 || 1) * (W - 2) + 1, Y = y => H - 2 - (y - a) / (b - a || 1) * (H - 4);
  const fit0 = Date.parse(sr.fit.t0), fy = x => sr.fit.at_t0 + sr.fit.per_year * (x - fit0) / (365.25 * 864e5);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">${tk.map((x, i) => `<rect x="${X(x) - .8}" y="${Y(v[i]) - .8}" width="1.6" height="1.6" fill="${color}" opacity=".55"/>`).join("")}
    <line x1="${X(t0)}" y1="${Y(fy(t0))}" x2="${X(t1)}" y2="${Y(fy(t1))}" stroke="#C2461B" stroke-width="1.6"/></svg>`;
}
const SHARE_C = x => x >= 1 ? "#8E1F1F" : x >= .2 ? "#C2461B" : x >= .05 ? "#D9A93A" : "#9DB07A";

  const trends = D.sources.filter(s => s.trend_status === "ok").sort((a, b) => (a.trend_value / Math.abs(a.trend_unit === "m/yr" ? .1 : 5)) - (b.trend_value / Math.abs(b.trend_unit === "m/yr" ? .1 : 5)));

/* ---------------- chapter 4: future ---------------- */
function futureNumbers(y) {
  const out = {};
  for (const c of D.scenarios) out[c] = { w: sumYear("water_ml", c, y), a: sumYear("acres", c, y), pw: pace.water_ml[c][y], pa: pace.acres[c][y] };
  return out;
}
function futureChart(y) {

  const X = i => L0 + i / (n - 1) * (W - L0 - R0), Y = v => T0p + (vmax - v) / vmax * (H - T0p - B0);
  const ann = YEARS.map((_, i) => people(sumYear("water_ml", "median", i)));
  const lo = YEARS.map((_, i) => people(sumYear("water_ml", "low", i))), hi = YEARS.map((_, i) => people(sumYear("water_ml", "high", i)));
  const pc = YEARS.map((_, i) => people(tot(i)));
  const line = a => a.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const band = hi.map((v, i) => `${X(i)},${Y(v)}`).join(" ") + " " + lo.map((v, i) => `${X(i)},${Y(v)}`).reverse().join(" ");
  const grid = [0, .25, .5, .75, 1].map(f => vmax * f);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="People's worth of water for the campuses, ${YEARS[0]} to ${YEARS[LAST]}">
    ${grid.map(v => `<line x1="${L0}" x2="${W - R0}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E6DFD1"/><text x="${L0 - 5}" y="${Y(v) + 3}" font-size="9.5" text-anchor="end" fill="#6F675A" font-family="IBM Plex Mono">${v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : Math.round(v / 1e3) + "k"}</text>`).join("")}
    <path d="${line(pc)}L${X(n - 1)},${Y(ann[n - 1])}${ann.map((v, i) => `L${X(n - 1 - i)},${Y(ann[n - 1 - i])}`).join("")}Z" fill="#B9832A" opacity=".10"/>
    <path d="${line(pc)}" fill="none" stroke="#B9832A" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="${band}" fill="#12808F" opacity=".14"/>
    <path d="${line(ann)}" fill="none" stroke="#12808F" stroke-width="2.2"/>
    <line x1="${X(y)}" x2="${X(y)}" y1="${T0p}" y2="${H - B0}" stroke="#1D1C1A" stroke-width="1"/>
    <circle cx="${X(y)}" cy="${Y(ann[y])}" r="4" fill="#12808F" stroke="#fff" stroke-width="1.5"/><circle cx="${X(y)}" cy="${Y(pc[y])}" r="4" fill="#B9832A" stroke="#fff" stroke-width="1.5"/>
    ${YEARS.map((yy, i) => i % (isNarrow() ? 3 : 1) === 0 || i === n - 1 ? `<text x="${X(i)}" y="${H - 5}" font-size="9.5" text-anchor="middle" fill="${i === y ? "#1D1C1A" : "#6F675A"}" font-family="IBM Plex Mono" font-weight="${i === y ? 600 : 400}">${String(yy).slice(2) === String(yy).slice(2) ? "'" + String(yy).slice(2) : yy}</text>` : "").join("")}
    <text x="${X(n - 1) - 4}" y="${Y(pc[n - 1]) - 8}" font-size="10" text-anchor="end" fill="#8A621B" font-family="IBM Plex Sans" font-weight="600">if the pace continues</text>
    <text x="${X(n - 1) - 4}" y="${Y(ann[n - 1]) + 16}" font-size="10" text-anchor="end" fill="#0E6670" font-family="IBM Plex Sans" font-weight="600">announced campuses</text>
  </svg>`;
}

  <div class="sensor" style="--c:#B9832A"><i></i><div><b>Projection (F2-F9)</b><p>Built campuses give acres per MW, water per kWh, and how long building takes (low / median / high). Announced MW, or capex divided by $ per MW, gives each announced campus's land and water to ${YEARS[LAST]} (F2-F8). F9 adds a separate "if the pace continues" line: the MW announced in the last two years, repeated every year. People's worth = ${fmt(PER_CAPITA)} liters per person per day (USGS 2015 US public supply).</p></div></div>
